cargo-features = [
	"different-binary-name",
]

[package]
name = "colonthree"
version = "0.0.0-git"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "colonthree"
filename = ":3"
path = "src/main.rs"
test = true
doctest = true
bench = true
doc = true
proc-macro = false
harness = true

[dependencies.mavitix-utils]
version = "0.0.0-git"
path = "../.."

[dependencies.anyhow]
version = ">=1.0.104, <2"

[dependencies.thiserror]
version = ">=2.0.20, <3"

[lints]
workspace = true