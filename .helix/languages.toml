[[language]]
name = "c"
scope = "source.c"
injection-regex = "c"
file-types = ["c", "h"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = [ "clangd" ]
indent = { tab-width = 4, unit = "\t"}
formatter = { command = "clang-format" }
auto-format = true

[language-server.clangd]
command = "clangd"
args = [ "--malloc-trim" ]

[[language]]
name = "gas"
scope = "source.gas"
file-types = ["s", "S", "asm"]
injection-regex = "gas"
comment-token = "#"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["asm-lsp"]

[[language]]
name = "nasm"
scope = "source.nasm"
file-types = []
injection-regex = "n?asm"
comment-token = ";"
indent = { tab-width = 4, unit = "\t" }
language-servers = ["asm-lsp"]

[[language]]
name = "rust"
scope = "source.rust"
injection-regex = "rs|rust"
file-types = ["rs"]
roots = ["Cargo.toml", "Cargo.lock"]
shebangs = ["rust-script", "cargo", "rustc"]
formatter = {
	command = "rustfmt",
}
auto-format = true
comment-tokens = ["//", "///", "//!"]
block-comment-tokens = [
  { start = "/*", end = "*/" },
  { start = "/**", end = "*/" },
  { start = "/*!", end = "*/" },
]
language-servers = [ "rust-analyzer" ]
indent = { tab-width = 4, unit = "\t" }
persistent-diagnostic-sources = ["rustc", "clippy"]
